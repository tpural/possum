apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "possum.fullname" . }}
  labels: {{- include "possum.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "possum.fullname" . }}
  labels: {{- include "possum.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "possum.fullname" . }}
  labels: {{- include "possum.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "possum.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "possum.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "possum.fullname" . }}
  labels: {{- include "possum.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [possum-state]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "possum.fullname" . }}
  labels: {{- include "possum.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "possum.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "possum.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "possum.fullname" . }}
  labels: {{- include "possum.labels" . | nindent 4 }}
spec:
  selector: {{- include "possum.selector" (dict "root" . "component" "provider") | nindent 4 }}
  ports:
    {{- if not .Values.autoscaler.enabled }}
    - name: grpc
      port: 8086
      targetPort: grpc
    {{- end }}
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "possum.fullname" . }}
  labels: {{- include "possum.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "possum.selector" (dict "root" . "component" "provider") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "possum.selector" (dict "root" . "component" "provider") | nindent 8 }}
      annotations:
        checksum/config: {{ toYaml .Values.config | sha256sum }}
        checksum/autoscaler: {{ toYaml .Values.autoscaler | sha256sum }}
    spec:
      serviceAccountName: {{ include "possum.fullname" . }}
      priorityClassName: system-cluster-critical
      {{- if .Values.provider.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: provider
          image: {{ include "possum.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - provider
            - --config=/etc/possum/config.yaml
            - --grpc-addr={{ if .Values.autoscaler.enabled }}127.0.0.1{{ end }}:8086
            - --http-addr=:{{ .Values.provider.httpPort }}
            - -v={{ .Values.provider.logLevel }}
          env:
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: POSSUM_UNIFI_USERNAME
              valueFrom: {secretKeyRef: {name: {{ include "possum.secretName" . }}, key: username, optional: true}}
            - name: POSSUM_UNIFI_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "possum.secretName" . }}, key: password, optional: true}}
          ports:
            {{- if not .Values.autoscaler.enabled }}
            - {name: grpc, containerPort: 8086}
            {{- end }}
            - {name: http, containerPort: {{ .Values.provider.httpPort }}}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
          resources: {{- toYaml .Values.provider.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /etc/possum, readOnly: true}
        {{- if .Values.autoscaler.enabled }}
        - name: cluster-autoscaler
          image: {{ .Values.autoscaler.image.repository }}:{{ .Values.autoscaler.image.tag }}
          command: [./cluster-autoscaler]
          args:
            - --cloud-provider=externalgrpc
            - --cloud-config=/etc/autoscaler/cloud-config.yaml
            - --namespace={{ .Release.Namespace }}
            - --address=127.0.0.1:8085
            {{- range $k, $v := .Values.autoscaler.args }}
            - --{{ $k }}={{ $v }}
            {{- end }}
          resources: {{- toYaml .Values.autoscaler.resources | nindent 12 }}
          securityContext:
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: cloud-config, mountPath: /etc/autoscaler, readOnly: true}
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "possum.fullname" . }}
        {{- if .Values.autoscaler.enabled }}
        - name: cloud-config
          configMap:
            name: {{ include "possum.fullname" . }}-autoscaler
        {{- end }}
      {{- with .Values.provider.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.provider.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "possum.affinity" (dict "root" . "affinity" .Values.provider.affinity) | nindent 6 }}
