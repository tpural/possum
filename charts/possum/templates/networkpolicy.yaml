{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "possum.fullname" . }}
  labels: {{- include "possum.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "possum.selector" (dict "root" . "component" "provider") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {port: grpc, protocol: TCP}
      from:
        - podSelector:
            matchLabels: {{- include "possum.selector" (dict "root" . "component" "autoscaler") | nindent 14 }}
    - ports:
        - {port: http, protocol: TCP}
{{- end }}
