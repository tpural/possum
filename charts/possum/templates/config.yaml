apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "possum.fullname" . }}
  labels: {{- include "possum.labels" . | nindent 4 }}
data:
  config.yaml: |
    apiVersion: possum.dev/v1alpha1
    kind: PossumConfig
    {{- toYaml .Values.config | nindent 4 }}
---
{{- if .Values.autoscaler.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "possum.fullname" . }}-autoscaler
  labels: {{- include "possum.labels" . | nindent 4 }}
data:
  cloud-config.yaml: |
    address: {{ include "possum.fullname" . }}.{{ .Release.Namespace }}.svc:8086
    grpc_timeout: 10s
{{- end }}
{{- if and (not .Values.credentials.existingSecret) .Values.credentials.username }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "possum.secretName" . }}
  labels: {{- include "possum.labels" . | nindent 4 }}
stringData:
  username: {{ .Values.credentials.username | quote }}
  password: {{ .Values.credentials.password | quote }}
{{- end }}
