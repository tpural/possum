version: "2"
linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - gosec
    - gocritic
    - misspell
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
    gosec:
      excludes:
        - G115
        - G304
  exclusions:
    presets:
      - std-error-handling
    paths:
      - internal/externalgrpc/protos
    rules:
      - path: _test\.go
        linters: [gosec]
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/tpural/possum
  exclusions:
    paths:
      - internal/externalgrpc/protos
